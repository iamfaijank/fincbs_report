<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Branch Dashboard</title>
		<style>
			:root {
				--primary-1: #097c80;
				--primary-2: #066164;
				--accent: #ffd700;
				--white: #fff;
				--shadow: rgba(0, 0, 0, 0.12);
			}
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			body {
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
				background: #f8fafc;
				padding-top: 120px;
			}

			header.header {
				position: fixed;
				top: 0;
				left: 0;
				right: 0;
				z-index: 1000;
				height: 120px;
				background: linear-gradient(135deg, var(--primary-1), var(--primary-2));
				color: var(--white);
				box-shadow: 0 1px 6px var(--shadow);
			}
			.header-top {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 18px 28px;
				position: relative;
			}
			.branch-name {
				font-size: 28px;
				font-weight: 700;
				line-height: 1.2;
			}
			.branch-name span {
				font-size: 15px;
				font-weight: 500;
				opacity: 0.9;
			}
			.header-center {
				position: absolute;
				left: 50%;
				transform: translateX(-50%);
			}
			form.branch-search {
				display: flex;
				gap: 10px;
				width: 420px;
				position: relative;
			}
			.branch-search input {
				flex: 1;
				padding: 10px 14px;
				border-radius: 8px;
				border: none;
				font-size: 14px;
				outline: none;
			}
			.branch-search button {
				padding: 10px 16px;
				border-radius: 8px;
				border: none;
				background: var(--accent);
				color: #1e293b;
				font-weight: 600;
				cursor: pointer;
				display: flex;
				align-items: center;
				gap: 6px;
			}
			.branch-search button:hover {
				background: #e6c200;
			}
			.back-button {
				display: flex;
				align-items: center;
				gap: 8px;
				color: var(--white);
				text-decoration: none;
				padding: 8px 14px;
				border-radius: 8px;
				background: rgba(255, 255, 255, 0.15);
				font-size: 14px;
			}
			.back-button:hover {
				background: rgba(255, 255, 255, 0.25);
			}
			.header-bottom {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 8px 28px 12px;
				font-size: 14px;
				opacity: 0.9;
				border-top: 1px solid rgba(255, 255, 255, 0.15);
			}
			.search-suggestions {
				position: absolute;
				top: 45px;
				left: 0;
				right: 0;
				background: white;
				color: #1e293b;
				border: 1px solid #e2e8f0;
				border-radius: 8px;
				max-height: 200px;
				overflow-y: auto;
				z-index: 1001;
				display: none;
			}
			.search-suggestions div {
				padding: 8px 12px;
				cursor: pointer;
				font-size: 13px; /* Adjusted for better readability */
			}
			.search-suggestions div:hover,
			.search-suggestions div.selected {
				background: #f0f0f0;
			}
			.search-suggestions div strong {
				color: #DAA520; /* Dark yellow for highlighted text */
			}

			@media (max-width: 768px) {
				body {
					padding-top: 180px;
				}
				header.header {
					height: auto;
				}
				.header-top {
					flex-direction: column;
					align-items: flex-start;
					gap: 14px;
				}
				.header-center {
					position: static;
					transform: none;
					width: 100%;
				}
				form.branch-search {
					width: 100%;
				}
			}
		</style>
	</head>
	<body>
		<header class="header">
			<div class="header-top">
				<h1 class="branch-name" id="branch-name">
					Loading... <span id="branch-sol"></span>
				</h1>

				<div class="header-center">
					<form class="branch-search" id="branch-search-form" role="search">
						<input
							type="search"
							id="branch-search-input"
							placeholder="Enter SOL ID or Branch Name"
							aria-label="Search branch"
						/>
						<button type="submit">Search</button>
						<div class="search-suggestions" id="search-suggestions"></div>
					</form>
				</div>

				<a
					href="#"
					class="back-button"
					onclick="
						window.history.back();
						return false;
					"
				>
					Back to Drishti
				</a>
			</div>

			<div class="header-bottom">
				<span id="branch-zone">--</span>, <span id="branch-region">--</span>,
				<span id="branch-state">--</span>
			</div>
		</header>

		<script>
			const branchNameEl = document.getElementById("branch-name");
			const branchSolEl = document.getElementById("branch-sol");
			const branchZoneEl = document.getElementById("branch-zone");
			const branchRegionEl = document.getElementById("branch-region");
			const branchStateEl = document.getElementById("branch-state");

			const searchInput = document.getElementById("branch-search-input");
			const searchSuggestions = document.getElementById("search-suggestions");
			const searchForm = document.getElementById("branch-search-form");
			let selectedSuggestionIndex = -1;


			function debounce(fn, delay) {
				let timer;
				return function (...args) {
					clearTimeout(timer);
					timer = setTimeout(() => fn.apply(this, args), delay);
				};
			}

			// Load branch header data by SOL ID
			function loadBranchHeader(sol_id) {
				fetch(
					`/api/method/custom_report.branch_v1.get_branch_header_data?sol_id=${sol_id}`,
				)
					.then((r) => r.json())
					.then((r) => {
						const b = r.message;
						if (b) {
							branchNameEl.innerHTML = b.branch + " <span>- " + b.sol_id + "</span>";
							branchSolEl.textContent = b.sol_id;
							branchZoneEl.textContent = b.zone || "--";
							branchRegionEl.textContent = b.region || "--";
							branchStateEl.textContent = b.state || "--";
						} else {
							branchNameEl.textContent = "Branch Not Found";
							branchSolEl.textContent = "";
							branchZoneEl.textContent = "--";
							branchRegionEl.textContent = "--";
							branchStateEl.textContent = "--";
						}
					})
					.catch(console.error);
			}

			// Fetch branch suggestions
			const fetchSuggestions = debounce(() => {
				const txt = searchInput.value.trim();
				if (!txt) {
					searchSuggestions.style.display = "none";
					return;
				}

				fetch(
					`/api/method/custom_report.branch_v1.search_branches?txt=${encodeURIComponent(txt)}`,
				)
					.then((r) => r.json())
					.then((r) => {
						const branches = r.message || [];
						searchSuggestions.innerHTML = "";
						selectedSuggestionIndex = -1;

						if (branches.length > 0) {
							branches.forEach((b) => {
								const div = document.createElement("div");
								const suggestionText = `${b.branch} - ${b.sol_id} (${b.state})`;
								const regex = new RegExp(txt, "gi");
								div.innerHTML = suggestionText.replace(regex, (match) => `<strong>${match}</strong>`);
								div.dataset.solId = b.sol_id;
								div.onclick = () => {
									selectSuggestion(b.sol_id);
								};
								searchSuggestions.appendChild(div);
							});
							searchSuggestions.style.display = "block";
						} else searchSuggestions.style.display = "none";
					})
					.catch(console.error);
			}, 300);

			function updateHighlight() {
				const suggestions = searchSuggestions.querySelectorAll("div");
				suggestions.forEach((suggestion, index) => {
					if (index === selectedSuggestionIndex) {
						suggestion.classList.add("selected");
						suggestion.scrollIntoView({ block: "nearest" });
					} else {
						suggestion.classList.remove("selected");
					}
				});
			}

			function selectSuggestion(sol_id) {
				searchInput.value = "";
				searchSuggestions.style.display = "none";
				selectedSuggestionIndex = -1;
				updateURLAndLoad(sol_id);
			}

			searchInput.addEventListener("input", fetchSuggestions);

			searchInput.addEventListener("keydown", (e) => {
				const suggestions = searchSuggestions.querySelectorAll("div");
				if (searchSuggestions.style.display === "none" || suggestions.length === 0) {
					return;
				}

				if (e.key === "ArrowDown") {
					e.preventDefault();
					selectedSuggestionIndex++;
					if (selectedSuggestionIndex >= suggestions.length) {
						selectedSuggestionIndex = 0;
					}
					updateHighlight();
				} else if (e.key === "ArrowUp") {
					e.preventDefault();
					selectedSuggestionIndex--;
					if (selectedSuggestionIndex < 0) {
						selectedSuggestionIndex = suggestions.length - 1;
					}
					updateHighlight();
				} else if (e.key === "Enter") {
					e.preventDefault();
					if (selectedSuggestionIndex !== -1) {
						const selected = suggestions[selectedSuggestionIndex];
						selectSuggestion(selected.dataset.solId);
					}
				} else if (e.key === "Escape") {
					searchSuggestions.style.display = "none";
				}
			});

			searchForm.addEventListener("submit", (e) => {
				e.preventDefault();
				const val = searchInput.value.trim();
				if (val) {
					fetch(
						`/api/method/custom_report.branch_v1.search_branches?txt=${encodeURIComponent(val)}`,
					)
						.then((r) => r.json())
						.then((r) => {
							if (r.message && r.message.length > 0)
								updateURLAndLoad(r.message[0].sol_id);
						})
						.catch(console.error);
				}
			});

			function updateURLAndLoad(sol_id) {
				const url = new URL(window.location);
				url.searchParams.set("sol_id", sol_id);
				window.history.pushState({}, "", url);
				loadBranchHeader(sol_id);
			}

			// Load branch from URL on page load
			document.addEventListener("DOMContentLoaded", () => {
				const params = new URLSearchParams(window.location.search);
				const sol_id = params.get("sol_id");
				if (sol_id) loadBranchHeader(sol_id);
			});

			// Hide suggestions when clicking outside
			document.addEventListener("click", (e) => {
				if (!searchForm.contains(e.target)) searchSuggestions.style.display = "none";
			});
		</script>
	</body>
</html>
