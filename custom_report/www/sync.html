<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>{{ title or "Automation Sync Tracker" }}</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.321.0/font/lucide.min.css" />

	<style>
		:root {
			--bg-page: #f8fafc;
			--bg-card: #ffffff;
			--bg-subtle: #f1f5f9;
			--border-color: #e2e8f0;
			--text-primary: #0f172a;
			--text-secondary: #475569;
			--text-muted: #94a3b8;
			--accent: #2563eb;
			--accent-hover: #1d4ed8;
			--success: #10b981;
			--danger: #ef4444;
			--warning: #f59e0b;
			--shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
			--shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
			--shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
		}

		[data-theme="dark"] {
			--bg-page: #0b0f19;
			--bg-card: #111827;
			--bg-subtle: #1f2937;
			--border-color: #374151;
			--text-primary: #f8fafc;
			--text-secondary: #cbd5e1;
			--text-muted: #64748b;
			--accent: #3b82f6;
			--accent-hover: #60a5fa;
		}

		* { box-sizing: border-box; margin: 0; padding: 0; }
		body {
			font-family: 'Inter', system-ui, -apple-system, sans-serif;
			background-color: var(--bg-page);
			color: var(--text-primary);
			line-height: 1.5;
			-webkit-font-smoothing: antialiased;
			height: 100vh;
			overflow: hidden;
		}

		/* Layout & Container */
		.app-container {
			display: flex;
			flex-direction: column;
			height: 100vh;
			max-width: 1024px;
			margin: 0 auto;
			padding: 0 1rem;
			position: relative;
		}

		/* Header */
		header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 1.25rem 0;
			border-bottom: 1px solid var(--border-color);
			flex-shrink: 0;
			gap: 0.75rem;
		}
		.brand {
			display: flex;
			align-items: center;
			gap: 0.75rem;
		}
		.brand-logo {
			width: 2rem;
			height: 2rem;
			border-radius: 0.5rem;
			background: var(--text-primary);
			color: var(--bg-card);
			font-weight: 800;
			font-size: 0.75rem;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.brand-text h1 { font-size: 0.95rem; font-weight: 700; line-height: 1.2; }
		.brand-text p { font-size: 0.7rem; color: var(--text-muted); font-weight: 500; }

		/* Auto Sync Toggle Pill */
		.auto-sync-btn {
			display: flex;
			align-items: center;
			gap: 0.5rem;
			padding: 0.35rem 0.85rem;
			border-radius: 9999px;
			font-size: 0.75rem;
			font-weight: 600;
			border: 1px solid var(--border-color);
			background: var(--bg-subtle);
			color: var(--text-secondary);
			cursor: pointer;
			transition: all 0.2s ease;
		}
		.auto-sync-btn.active {
			background: rgba(16, 185, 129, 0.1);
			color: var(--success);
			border-color: rgba(16, 185, 129, 0.3);
		}
		.status-dot-pulse {
			width: 0.4rem;
			height: 0.4rem;
			border-radius: 50%;
			background: currentColor;
		}
		.auto-sync-btn.active .status-dot-pulse {
			animation: pulse 1.5s infinite;
		}

		/* Header Actions */
		.header-actions {
			display: flex;
			align-items: center;
			gap: 0.5rem;
		}
		.preset-btn-group {
			display: flex;
			background: var(--bg-subtle);
			padding: 0.15rem;
			border-radius: 0.5rem;
			gap: 0.25rem;
		}
		.preset-btn {
			padding: 0.25rem 0.6rem;
			font-size: 0.7rem;
			font-weight: 600;
			border: none;
			border-radius: 0.35rem;
			background: transparent;
			color: var(--text-secondary);
			cursor: pointer;
			transition: all 0.15s ease;
		}
		.preset-btn.active {
			background: var(--bg-card);
			color: var(--text-primary);
			box-shadow: var(--shadow-sm);
		}
		.date-input {
			background: var(--bg-card);
			border: 1px solid var(--border-color);
			border-radius: 0.5rem;
			padding: 0.35rem 0.6rem;
			font-size: 0.75rem;
			font-weight: 600;
			color: var(--text-primary);
			outline: none;
			cursor: pointer;
		}
		.icon-btn {
			padding: 0.45rem;
			border-radius: 0.5rem;
			border: 1px solid var(--border-color);
			background: var(--bg-card);
			color: var(--text-muted);
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: all 0.15s ease;
		}
		.icon-btn:hover { color: var(--text-primary); }

		/* Main Content */
		main {
			flex: 1;
			overflow-y: auto;
			padding: 1rem 0 7rem 0;
		}

		/* Stats Grid */
		.stats-grid {
			display: grid;
			grid-template-columns: repeat(4, 1fr);
			gap: 0.75rem;
			padding: 1rem;
			border-radius: 0.75rem;
			background: var(--bg-card);
			border: 1px solid var(--border-color);
			margin-bottom: 1rem;
		}
		.stat-card span { display: block; }
		.stat-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
		.stat-val { font-size: 1.25rem; font-weight: 800; color: var(--text-primary); margin-top: 0.15rem; }
		.stat-val.success { color: var(--success); }
		.stat-val.danger { color: var(--danger); }
		.stat-val.warning { color: var(--warning); }

		/* Toolbar: Search & Refresh */
		.toolbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 0.75rem;
			margin-bottom: 1rem;
		}
		.search-box {
			position: relative;
			flex: 1;
		}
		.search-box i {
			position: absolute;
			left: 0.75rem;
			top: 50%;
			transform: translateY(-50%);
			font-size: 0.8rem;
			color: var(--text-muted);
		}
		.search-input {
			width: 100%;
			background: var(--bg-card);
			border: 1px solid var(--border-color);
			border-radius: 0.5rem;
			padding: 0.45rem 0.75rem 0.45rem 2.1rem;
			font-size: 0.8rem;
			color: var(--text-primary);
			outline: none;
			transition: border-color 0.2s;
		}
		.search-input:focus { border-color: var(--text-primary); }

		/* Job List */
		.job-list {
			border: 1px solid var(--border-color);
			border-radius: 0.75rem;
			background: var(--bg-card);
			overflow: hidden;
		}
		.job-item {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 0.85rem 1rem;
			border-bottom: 1px solid var(--border-color);
			cursor: pointer;
			transition: background 0.15s ease;
		}
		.job-item:last-child { border-bottom: none; }
		.job-item:hover { background: var(--bg-subtle); }
		.job-left {
			display: flex;
			align-items: center;
			gap: 0.75rem;
			min-width: 0;
			flex: 1;
		}
		.status-dot {
			width: 0.6rem;
			height: 0.6rem;
			border-radius: 50%;
			flex-shrink: 0;
		}
		.status-dot.success { background: var(--success); }
		.status-dot.failed { background: var(--danger); }
		.status-dot.pending { background: var(--warning); }

		.job-title {
			font-size: 0.8rem;
			font-weight: 700;
			color: var(--text-primary);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}
		.job-right {
			display: flex;
			align-items: center;
			gap: 1rem;
			font-size: 0.75rem;
			color: var(--text-secondary);
			flex-shrink: 0;
		}
		.job-time { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--text-muted); }
		.job-recs { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--text-primary); text-align: right; }
		.job-status-text { font-size: 0.7rem; font-weight: 700; text-transform: capitalize; }
		.job-status-text.success { color: var(--success); }
		.job-status-text.failed { color: var(--danger); }
		.job-status-text.pending { color: var(--warning); }

		.btn-run {
			padding: 0.3rem 0.75rem;
			font-size: 0.7rem;
			font-weight: 700;
			border-radius: 0.375rem;
			border: 1px solid var(--border-color);
			background: var(--bg-card);
			color: var(--text-primary);
			cursor: pointer;
			transition: all 0.15s ease;
		}
		.btn-run:hover { background: var(--text-primary); color: var(--bg-card); }
		.btn-run:disabled { opacity: 0.5; cursor: not-allowed; }

		/* Floating Dock */
		.floating-dock {
			position: fixed;
			bottom: 1.25rem;
			left: 50%;
			transform: translateX(-50%);
			z-index: 40;
			display: flex;
			align-items: center;
			gap: 0.5rem;
			padding: 0.4rem 0.6rem;
			border-radius: 1rem;
			background: var(--bg-card);
			border: 1px solid var(--border-color);
			box-shadow: var(--shadow-lg);
			backdrop-filter: blur(16px);
			-webkit-backdrop-filter: blur(16px);
		}
		.filter-tab {
			padding: 0.35rem 0.75rem;
			border-radius: 0.6rem;
			font-size: 0.75rem;
			font-weight: 600;
			border: none;
			background: transparent;
			color: var(--text-secondary);
			cursor: pointer;
			display: flex;
			align-items: center;
			gap: 0.35rem;
			transition: all 0.15s ease;
		}
		.filter-tab.active {
			background: var(--text-primary);
			color: var(--bg-card);
		}
		.tab-badge {
			font-size: 0.65rem;
			padding: 0.05rem 0.35rem;
			border-radius: 9999px;
			background: var(--bg-subtle);
			color: var(--text-secondary);
		}
		.filter-tab.active .tab-badge {
			background: rgba(255,255,255,0.2);
			color: inherit;
		}
		.btn-run-all {
			padding: 0.35rem 0.85rem;
			border-radius: 0.6rem;
			font-size: 0.75rem;
			font-weight: 700;
			border: none;
			background: var(--text-primary);
			color: var(--bg-card);
			cursor: pointer;
			display: flex;
			align-items: center;
			gap: 0.35rem;
			transition: all 0.15s ease;
		}
		.btn-run-all:disabled { opacity: 0.5; cursor: not-allowed; }

		/* Glassmorphism Modal (User Memory Rule Enforced) */
		.modal-backdrop {
			position: fixed;
			inset: 0;
			z-index: 50;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 1rem;
			background: rgba(0, 0, 0, 0.45);
			-webkit-backdrop-filter: blur(12px);
			backdrop-filter: blur(12px);
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.2s ease;
		}
		.modal-backdrop.open {
			opacity: 1;
			pointer-events: auto;
		}
		.modal-card {
			background: var(--bg-card);
			border: 1px solid var(--border-color);
			border-radius: 1rem;
			width: 100%;
			max-width: 500px;
			max-height: 85vh;
			display: flex;
			flex-direction: column;
			box-shadow: var(--shadow-lg);
			transform: scale(0.95);
			transition: transform 0.2s ease;
			overflow: hidden;
		}
		.modal-backdrop.open .modal-card {
			transform: scale(1);
		}
		.modal-header {
			padding: 1rem 1.25rem;
			border-bottom: 1px solid var(--border-color);
			display: flex;
			align-items: center;
			justify-content: space-between;
		}
		.modal-body {
			padding: 1.25rem;
			overflow-y: auto;
			display: flex;
			flex-direction: column;
			gap: 1rem;
			font-size: 0.75rem;
		}
		.modal-footer {
			padding: 0.85rem 1.25rem;
			border-top: 1px solid var(--border-color);
			display: flex;
			align-items: center;
			justify-content: flex-end;
			gap: 0.5rem;
		}
		.info-grid {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 0.5rem;
			background: var(--bg-subtle);
			padding: 0.75rem;
			border-radius: 0.5rem;
		}
		.code-box {
			background: var(--bg-subtle);
			padding: 0.6rem;
			border-radius: 0.5rem;
			font-family: 'JetBrains Mono', monospace;
			font-size: 0.7rem;
			word-break: break-all;
			user-select: all;
		}
		.error-box {
			background: rgba(239, 68, 68, 0.1);
			color: var(--danger);
			border: 1px solid rgba(239, 68, 68, 0.2);
			padding: 0.75rem;
			border-radius: 0.5rem;
			font-family: 'JetBrains Mono', monospace;
			font-size: 0.7rem;
			white-space: pre-wrap;
			max-height: 160px;
			overflow-y: auto;
		}

		/* Toast Notification */
		.toast {
			position: fixed;
			top: 1rem;
			right: 1rem;
			z-index: 60;
			padding: 0.6rem 1rem;
			border-radius: 0.75rem;
			font-size: 0.75rem;
			font-weight: 600;
			background: var(--text-primary);
			color: var(--bg-card);
			box-shadow: var(--shadow-lg);
			display: flex;
			align-items: center;
			gap: 0.5rem;
			transform: translateY(-20px);
			opacity: 0;
			transition: all 0.25s ease;
			pointer-events: none;
		}
		.toast.show {
			transform: translateY(0);
			opacity: 1;
			pointer-events: auto;
		}

		@media (max-width: 640px) {
			.stats-grid { grid-template-columns: repeat(2, 1fr); }
			.preset-btn-group { display: none; }
			.job-time { display: none; }
		}
		@keyframes pulse {
			0%, 100% { opacity: 1; }
			50% { opacity: 0.4; }
		}
		.spin { animation: spin 1s linear infinite; }
		@keyframes spin { 100% { transform: rotate(360deg); } }
	</style>
</head>
<body>

	<div class="app-container">

		<!-- Header -->
		<header>
			<div class="brand">
				<div class="brand-logo">ST</div>
				<div class="brand-text">
					<h1>Automation Sync Tracker</h1>
					<p>Sahayog Bench</p>
				</div>
			</div>

			<button type="button" id="btnAutoSync" class="auto-sync-btn" title="Toggle Auto Sync">
				<span class="status-dot-pulse"></span>
				<span id="txtAutoSync">Checking...</span>
			</button>

			<div class="header-actions">
				<div class="preset-btn-group">
					<button type="button" class="preset-btn" data-preset="yesterday">Yesterday</button>
					<button type="button" class="preset-btn" data-preset="today">Today</button>
				</div>
				<input type="date" id="targetDate" class="date-input" aria-label="Select Date">
				<button type="button" id="btnThemeToggle" class="icon-btn" title="Toggle Theme" aria-label="Toggle Theme">
					<i class="icon-lucide-moon" id="iconTheme"></i>
				</button>
			</div>
		</header>

		<!-- Main Workspace -->
		<main>
			<!-- Stats Summary -->
			<div class="stats-grid">
				<div class="stat-card">
					<span class="stat-label">TOTAL JOBS</span>
					<span class="stat-val" id="statTotal">0</span>
				</div>
				<div class="stat-card">
					<span class="stat-label">SUCCESS</span>
					<span class="stat-val success" id="statSuccess">0</span>
				</div>
				<div class="stat-card">
					<span class="stat-label">FAILED</span>
					<span class="stat-val danger" id="statFailed">0</span>
				</div>
				<div class="stat-card">
					<span class="stat-label">PENDING</span>
					<span class="stat-val warning" id="statPending">0</span>
				</div>
			</div>

			<!-- Search & Viewing Toolbar -->
			<div class="toolbar">
				<div class="search-box">
					<i class="icon-lucide-search"></i>
					<input type="text" id="searchInput" class="search-input" placeholder="Search automations..." aria-label="Search automations">
				</div>
				<button type="button" id="btnRefresh" class="icon-btn" title="Refresh Data" aria-label="Refresh Data">
					<i class="icon-lucide-rotate-cw" id="iconRefresh"></i>
				</button>
			</div>

			<!-- Job List Container -->
			<div class="job-list" id="jobListContainer">
				<div style="padding: 2.5rem; text-align: center; color: var(--text-muted); font-size: 0.8rem;">
					Loading automations...
				</div>
			</div>
		</main>

		<!-- Floating Navigation & Action Bar -->
		<div class="floating-dock">
			<button type="button" class="filter-tab active" data-tab="all">
				All <span class="tab-badge" id="cntAll">0</span>
			</button>
			<button type="button" class="filter-tab" data-tab="success">
				Success <span class="tab-badge" id="cntSuccess">0</span>
			</button>
			<button type="button" class="filter-tab" data-tab="failed">
				Failed <span class="tab-badge" id="cntFailed">0</span>
			</button>
			<button type="button" class="filter-tab" data-tab="pending">
				Pending <span class="tab-badge" id="cntPending">0</span>
			</button>

			<div style="width: 1px; height: 1rem; background: var(--border-color);"></div>

			<button type="button" id="btnRunPending" class="btn-run-all">
				<i class="icon-lucide-play"></i> Run Pending
			</button>
		</div>

	</div>

	<!-- Glassmorphism Popup Modal -->
	<div class="modal-backdrop" id="modalBackdrop">
		<div class="modal-card">
			<div class="modal-header">
				<div style="display: flex; align-items: center; gap: 0.5rem;">
					<span class="status-dot" id="modalStatusDot"></span>
					<h2 style="font-size: 0.85rem; font-weight: 700;" id="modalTitle">Job Details</h2>
				</div>
				<button type="button" id="btnModalClose" class="icon-btn" style="border: none; background: transparent;" aria-label="Close">
					<i class="icon-lucide-x"></i>
				</button>
			</div>
			<div class="modal-body">
				<div class="info-grid">
					<div>
						<span style="color: var(--text-muted); font-size: 0.65rem;">Date</span>
						<div style="font-weight: 700;" id="modalDate">-</div>
					</div>
					<div>
						<span style="color: var(--text-muted); font-size: 0.65rem;">Status</span>
						<div style="font-weight: 700;" id="modalStatus">-</div>
					</div>
					<div>
						<span style="color: var(--text-muted); font-size: 0.65rem;">Records</span>
						<div style="font-weight: 700; font-family: monospace;" id="modalRecs">0</div>
					</div>
				</div>

				<div>
					<span style="color: var(--text-muted); font-size: 0.65rem; font-weight: 700; text-transform: uppercase;">Category</span>
					<div style="font-weight: 600; margin-top: 0.1rem;" id="modalCategory">-</div>
				</div>

				<div id="modalLatestBox" style="display: none; background: var(--bg-subtle); padding: 0.6rem; border-radius: 0.5rem;">
					<span style="color: var(--text-muted); font-size: 0.65rem;">Latest DB Sync Found</span>
					<div style="font-weight: 700; font-family: monospace;" id="modalLatestVal">-</div>
				</div>

				<div>
					<div style="display: flex; justify-content: space-between; margin-bottom: 0.2rem;">
						<span style="color: var(--text-muted); font-size: 0.65rem; font-weight: 700; text-transform: uppercase;">Python Method</span>
						<a href="#" id="btnCopyMethod" style="color: var(--accent); font-size: 0.65rem; text-decoration: none;">Copy Method</a>
					</div>
					<div class="code-box" id="modalMethod">-</div>
				</div>

				<div id="modalErrorContainer">
					<div style="display: flex; justify-content: space-between; margin-bottom: 0.2rem;">
						<span style="color: var(--danger); font-size: 0.65rem; font-weight: 700; text-transform: uppercase;">Log / Traceback</span>
						<a href="#" id="btnCopyTraceback" style="color: var(--danger); font-size: 0.65rem; text-decoration: none;">Copy Traceback</a>
					</div>
					<div class="error-box" id="modalErrorText">-</div>
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn-run" style="padding: 0.4rem 1rem;" id="btnModalClose2">Close</button>
				<button type="button" class="btn-run-all" id="btnModalRunNow">Run Now</button>
			</div>
		</div>
	</div>

	<!-- Toast Notification -->
	<div class="toast" id="toast">
		<i class="icon-lucide-check-circle" id="toastIcon"></i>
		<span id="toastMsg">Notification</span>
	</div>

	<script>
		// Global Window Config from Jinja Context
		window.csrf_token = "{{ csrf_token }}";

		(function() {
			// State
			let state = {
				loading: false,
				autoSyncEnabled: true,
				targetDate: getYesterdayStr(),
				jobs: [],
				searchQuery: '',
				activeTab: 'all',
				activeModalJob: null,
				runningJobs: {},
				isDark: localStorage.getItem('theme') === 'dark'
			};

			// DOM Elements
			const els = {
				btnAutoSync: document.getElementById('btnAutoSync'),
				txtAutoSync: document.getElementById('txtAutoSync'),
				targetDate: document.getElementById('targetDate'),
				btnThemeToggle: document.getElementById('btnThemeToggle'),
				iconTheme: document.getElementById('iconTheme'),
				btnRefresh: document.getElementById('btnRefresh'),
				iconRefresh: document.getElementById('iconRefresh'),
				searchInput: document.getElementById('searchInput'),
				jobListContainer: document.getElementById('jobListContainer'),
				statTotal: document.getElementById('statTotal'),
				statSuccess: document.getElementById('statSuccess'),
				statFailed: document.getElementById('statFailed'),
				statPending: document.getElementById('statPending'),
				cntAll: document.getElementById('cntAll'),
				cntSuccess: document.getElementById('cntSuccess'),
				cntFailed: document.getElementById('cntFailed'),
				cntPending: document.getElementById('cntPending'),
				btnRunPending: document.getElementById('btnRunPending'),
				modalBackdrop: document.getElementById('modalBackdrop'),
				btnModalClose: document.getElementById('btnModalClose'),
				btnModalClose2: document.getElementById('btnModalClose2'),
				btnModalRunNow: document.getElementById('btnModalRunNow'),
				modalTitle: document.getElementById('modalTitle'),
				modalStatusDot: document.getElementById('modalStatusDot'),
				modalDate: document.getElementById('modalDate'),
				modalStatus: document.getElementById('modalStatus'),
				modalRecs: document.getElementById('modalRecs'),
				modalCategory: document.getElementById('modalCategory'),
				modalLatestBox: document.getElementById('modalLatestBox'),
				modalLatestVal: document.getElementById('modalLatestVal'),
				modalMethod: document.getElementById('modalMethod'),
				modalErrorContainer: document.getElementById('modalErrorContainer'),
				modalErrorText: document.getElementById('modalErrorText'),
				btnCopyMethod: document.getElementById('btnCopyMethod'),
				btnCopyTraceback: document.getElementById('btnCopyTraceback'),
				toast: document.getElementById('toast'),
				toastMsg: document.getElementById('toastMsg'),
				toastIcon: document.getElementById('toastIcon')
			};

			function getYesterdayStr() {
				const d = new Date(Date.now() - 86400000);
				return d.toISOString().split('T')[0];
			}
			function getTodayStr() {
				return new Date().toISOString().split('T')[0];
			}

			function formatDate(dStr) {
				if (!dStr) return '';
				const parts = dStr.split(' ')[0].split('-');
				return parts.length === 3 ? `${parts[2]}-${parts[1]}-${parts[0]}` : dStr;
			}
			function formatNum(num) {
				if (!num && num !== 0) return '0';
				return Number(num).toLocaleString('en-IN');
			}

			let toastTimer = null;
			function showToast(msg, type = 'info') {
				if (toastTimer) clearTimeout(toastTimer);
				els.toastMsg.innerText = msg;
				els.toastIcon.className = type === 'success' ? 'icon-lucide-check-circle' : type === 'error' ? 'icon-lucide-alert-circle' : 'icon-lucide-info';
				els.toast.classList.add('show');
				toastTimer = setTimeout(() => els.toast.classList.remove('show'), 3000);
			}

			function applyTheme() {
				if (state.isDark) {
					document.documentElement.setAttribute('data-theme', 'dark');
					els.iconTheme.className = 'icon-lucide-sun';
				} else {
					document.documentElement.removeAttribute('data-theme');
					els.iconTheme.className = 'icon-lucide-moon';
				}
			}

			// Fetch Data from Python API
			async function fetchStatus() {
				state.loading = true;
				els.iconRefresh.classList.add('spin');
				try {
					const res = await fetch(`/api/method/custom_report.api.get_automation_sync_status?sync_date=${state.targetDate}`);
					if (!res.ok) throw new Error(`HTTP ${res.status}`);
					const data = await res.json();
					if (data.message) {
						state.jobs = data.message.jobs || [];
						state.autoSyncEnabled = !!data.message.auto_sync_enabled;
						render();
					}
				} catch (e) {
					console.error(e);
					showToast('Failed to load sync status', 'error');
				} finally {
					state.loading = false;
					els.iconRefresh.classList.remove('spin');
				}
			}

			async function toggleAutoSync() {
				const newVal = !state.autoSyncEnabled;
				try {
					const res = await fetch(`/api/method/custom_report.api.toggle_drishti_auto_sync`, {
						method: 'POST',
						headers: { 'Content-Type': 'application/json', 'X-Frappe-CSRF-Token': window.csrf_token || '' },
						body: JSON.stringify({ enabled: newVal })
					});
					if (!res.ok) throw new Error(`HTTP ${res.status}`);
					const data = await res.json();
					if (data.message && data.message.status === 'success') {
						state.autoSyncEnabled = data.message.auto_sync_enabled;
						showToast(`Auto Sync ${state.autoSyncEnabled ? 'Enabled' : 'Disabled'}`, 'success');
						fetchStatus();
					}
				} catch (e) {
					showToast('Error toggling Auto Sync', 'error');
				}
			}

			async function runJob(jobKey) {
				if (!jobKey) return;
				state.runningJobs[jobKey] = true;
				render();
				try {
					const res = await fetch(`/api/method/custom_report.api.trigger_manual_sync`, {
						method: 'POST',
						headers: { 'Content-Type': 'application/json', 'X-Frappe-CSRF-Token': window.csrf_token || '' },
						body: JSON.stringify({ job_key: jobKey, sync_date: state.targetDate })
					});
					if (!res.ok) throw new Error(`HTTP ${res.status}`);
					const data = await res.json();
					if (data.message) {
						showToast(data.message.message || 'Job triggered', 'success');
						await fetchStatus();
					}
				} catch (e) {
					showToast(`Execution error: ${e.message}`, 'error');
				} finally {
					delete state.runningJobs[jobKey];
					render();
				}
			}

			async function runPending() {
				const pending = state.jobs.filter(j => ['pending', 'failed'].includes((j.status || '').toLowerCase()));
				if (pending.length === 0) {
					showToast('No pending jobs to run', 'info');
					return;
				}
				showToast(`Running ${pending.length} pending job(s)...`, 'info');
				els.btnRunPending.disabled = true;
				for (const job of pending) {
					await runJob(job.key);
				}
				els.btnRunPending.disabled = false;
				showToast('Pending jobs execution completed!', 'success');
			}

			// Render UI
			function render() {
				// Auto Sync Button
				if (state.autoSyncEnabled) {
					els.btnAutoSync.classList.add('active');
					els.txtAutoSync.innerText = 'Auto Sync Active';
				} else {
					els.btnAutoSync.classList.remove('active');
					els.txtAutoSync.innerText = 'Auto Sync Off';
				}

				els.targetDate.value = state.targetDate;

				// Counts
				const total = state.jobs.length;
				const success = state.jobs.filter(j => (j.status || '').toLowerCase() === 'success').length;
				const failed = state.jobs.filter(j => (j.status || '').toLowerCase() === 'failed').length;
				const pending = state.jobs.filter(j => (j.status || '').toLowerCase() === 'pending').length;

				els.statTotal.innerText = total;
				els.statSuccess.innerText = success;
				els.statFailed.innerText = failed;
				els.statPending.innerText = pending;

				els.cntAll.innerText = total;
				els.cntSuccess.innerText = success;
				els.cntFailed.innerText = failed;
				els.cntPending.innerText = pending;

				// Filter Jobs
				const q = state.searchQuery.toLowerCase().trim();
				const filtered = state.jobs.filter(job => {
					const s = (job.status || '').toLowerCase();
					if (state.activeTab !== 'all' && s !== state.activeTab) return false;
					if (q) {
						return (job.title || '').toLowerCase().includes(q) ||
							   (job.method || '').toLowerCase().includes(q) ||
							   (job.category || '').toLowerCase().includes(q);
					}
					return true;
				});

				// Build HTML for Job List
				if (filtered.length === 0) {
					els.jobListContainer.innerHTML = `
						<div style="padding: 2.5rem; text-align: center; color: var(--text-muted); font-size: 0.8rem;">
							No matching automation jobs found.
						</div>
					`;
					return;
				}

				els.jobListContainer.innerHTML = filtered.map(job => {
					const st = (job.status || '').toLowerCase();
					const isRunning = !!state.runningJobs[job.key];
					const latestInfo = (job.latest_date && job.records_synced === 0) ?
						`<div style="font-size:0.65rem; color: var(--text-muted); font-family: monospace;">Last: ${formatDate(job.latest_date)} (${formatNum(job.latest_count)})</div>` : '';

					return `
						<div class="job-item" data-key="${job.key}">
							<div class="job-left">
								<span class="status-dot ${st}"></span>
								<div class="job-title">${job.title}</div>
							</div>
							<div class="job-right">
								<span class="job-time">${job.schedule_time || ''}</span>
								<div style="display:flex; flex-direction:column; align-items:flex-end;">
									<span class="job-recs">${formatNum(job.records_synced)} recs</span>
									${latestInfo}
								</div>
								<span class="job-status-text ${st}">${job.status}</span>
								<button type="button" class="btn-run" data-action="run" data-key="${job.key}" ${isRunning ? 'disabled' : ''}>
									${isRunning ? 'Running...' : 'Run'}
								</button>
							</div>
						</div>
					`;
				}).join('');
			}

			// Open Modal
			function openModal(job) {
				state.activeModalJob = job;
				const st = (job.status || '').toLowerCase();
				els.modalTitle.innerText = job.title;
				els.modalStatusDot.className = `status-dot ${st}`;
				els.modalDate.innerText = formatDate(job.target_date);
				els.modalStatus.innerText = job.status;
				els.modalStatus.className = `job-status-text ${st}`;
				els.modalRecs.innerText = formatNum(job.records_synced);
				els.modalCategory.innerText = job.category || 'General';

				if (job.latest_date) {
					els.modalLatestBox.style.display = 'block';
					els.modalLatestVal.innerText = `${formatDate(job.latest_date)} (${formatNum(job.latest_count)} records)`;
				} else {
					els.modalLatestBox.style.display = 'none';
				}

				els.modalMethod.innerText = job.method || '';

				if (job.error_message) {
					els.modalErrorContainer.style.display = 'block';
					els.modalErrorText.innerText = job.error_message;
				} else {
					els.modalErrorContainer.style.display = 'none';
				}

				els.modalBackdrop.classList.add('open');
			}
			function closeModal() {
				els.modalBackdrop.classList.remove('open');
				state.activeModalJob = null;
			}

			// Event Listeners
			els.btnAutoSync.addEventListener('click', toggleAutoSync);
			els.targetDate.addEventListener('change', (e) => {
				state.targetDate = e.target.value;
				fetchStatus();
			});
			els.btnThemeToggle.addEventListener('click', () => {
				state.isDark = !state.isDark;
				localStorage.setItem('theme', state.isDark ? 'dark' : 'light');
				applyTheme();
			});
			els.btnRefresh.addEventListener('click', fetchStatus);
			els.searchInput.addEventListener('input', (e) => {
				state.searchQuery = e.target.value;
				render();
			});

			// Preset date buttons
			document.querySelectorAll('.preset-btn').forEach(btn => {
				btn.addEventListener('click', () => {
					document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
					btn.classList.add('active');
					state.targetDate = btn.dataset.preset === 'today' ? getTodayStr() : getYesterdayStr();
					fetchStatus();
				});
			});

			// Filter tabs
			document.querySelectorAll('.filter-tab').forEach(tab => {
				tab.addEventListener('click', () => {
					document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
					tab.classList.add('active');
					state.activeTab = tab.dataset.tab;
					render();
				});
			});

			// Job list item click & run button click
			els.jobListContainer.addEventListener('click', (e) => {
				const runBtn = e.target.closest('[data-action="run"]');
				if (runBtn) {
					e.stopPropagation();
					runJob(runBtn.dataset.key);
					return;
				}
				const item = e.target.closest('.job-item');
				if (item) {
					const job = state.jobs.find(j => j.key === item.dataset.key);
					if (job) openModal(job);
				}
			});

			// Modal actions
			els.btnModalClose.addEventListener('click', closeModal);
			els.btnModalClose2.addEventListener('click', closeModal);
			els.modalBackdrop.addEventListener('click', (e) => {
				if (e.target === els.modalBackdrop) closeModal();
			});
			document.addEventListener('keydown', (e) => {
				if (e.key === 'Escape' && els.modalBackdrop.classList.contains('open')) closeModal();
			});

			els.btnModalRunNow.addEventListener('click', () => {
				if (state.activeModalJob) {
					runJob(state.activeModalJob.key);
					closeModal();
				}
			});

			els.btnCopyMethod.addEventListener('click', (e) => {
				e.preventDefault();
				if (state.activeModalJob && state.activeModalJob.method) {
					navigator.clipboard.writeText(state.activeModalJob.method);
					showToast('Method copied to clipboard!', 'success');
				}
			});
			els.btnCopyTraceback.addEventListener('click', (e) => {
				e.preventDefault();
				if (state.activeModalJob && state.activeModalJob.error_message) {
					navigator.clipboard.writeText(state.activeModalJob.error_message);
					showToast('Traceback copied to clipboard!', 'success');
				}
			});

			els.btnRunPending.addEventListener('click', runPending);

			// Init
			applyTheme();
			state.targetDate = getYesterdayStr();
			fetchStatus();
		})();
	</script>
</body>
</html>
