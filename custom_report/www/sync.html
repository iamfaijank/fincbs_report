<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<title>{{ title or "Automation Sync Tracker" }}</title>
	
	<!-- PWA Meta Tags -->
	<link rel="manifest" href="/assets/custom_report/sync-manifest.json">
	<meta name="theme-color" content="#0284c7" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Sync Tracker">
	<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='128' fill='%230284c7'/%3E%3Cpath d='M256 120a136 136 0 1 1-136 136' stroke='%23ffffff' stroke-width='40' stroke-linecap='round' fill='none'/%3E%3Cpolyline points='120 180 120 256 196 256' stroke='%23ffffff' stroke-width='40' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

	<style>
		:root {
			--bg-page: #f8fafc;
			--bg-card: #ffffff;
			--bg-subtle: #f1f5f9;
			--border: #e2e8f0;
			--text-main: #0f172a;
			--text-sub: #64748b;
			--text-muted: #94a3b8;
			--primary: #0284c7;
			--primary-hover: #0369a1;
			--success: #16a34a;
			--success-bg: rgba(22, 163, 74, 0.1);
			--danger: #dc2626;
			--danger-bg: rgba(220, 38, 38, 0.1);
			--warning: #d97706;
			--warning-bg: rgba(217, 119, 6, 0.1);
			--shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
			--shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
		}

		[data-theme="dark"] {
			--bg-page: #0b1120;
			--bg-card: #1e293b;
			--bg-subtle: #0f172a;
			--border: #334155;
			--text-main: #f8fafc;
			--text-sub: #94a3b8;
			--text-muted: #64748b;
			--primary: #38bdf8;
			--primary-hover: #7dd3fc;
			--success: #4ade80;
			--success-bg: rgba(74, 222, 128, 0.12);
			--danger: #f87171;
			--danger-bg: rgba(248, 113, 113, 0.12);
			--warning: #fbbf24;
			--warning-bg: rgba(251, 191, 36, 0.12);
			--shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
			--shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
		}

		* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
		body {
			font-family: 'Inter', system-ui, -apple-system, sans-serif;
			background-color: var(--bg-page);
			color: var(--text-main);
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			-webkit-font-smoothing: antialiased;
			padding-top: max(0.5rem, env(safe-area-inset-top));
			padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
		}

		/* Main Shell */
		.app-container {
			width: 100%;
			max-width: 860px;
			margin: 0 auto;
			padding: 0.75rem 1rem 2rem;
			display: flex;
			flex-direction: column;
			gap: 1rem;
		}

		/* Top Nav */
		.app-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 0.75rem;
			background: var(--bg-card);
			border: 1px solid var(--border);
			padding: 0.75rem 1rem;
			border-radius: 1rem;
			box-shadow: var(--shadow-sm);
		}
		.brand-box {
			display: flex;
			align-items: center;
			gap: 0.65rem;
			min-width: 0;
		}
		.brand-logo {
			width: 2.25rem;
			height: 2.25rem;
			border-radius: 0.65rem;
			background: linear-gradient(135deg, var(--primary), #6366f1);
			color: #ffffff;
			display: flex;
			align-items: center;
			justify-content: center;
			font-weight: 800;
			font-size: 0.85rem;
			box-shadow: var(--shadow-sm);
			flex-shrink: 0;
		}
		.brand-text { min-width: 0; }
		.brand-title {
			font-size: 0.95rem;
			font-weight: 700;
			color: var(--text-main);
			line-height: 1.2;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}
		.brand-subtitle {
			font-size: 0.68rem;
			color: var(--text-sub);
			font-weight: 500;
		}

		.header-actions {
			display: flex;
			align-items: center;
			gap: 0.45rem;
			flex-shrink: 0;
		}
		.btn-pill {
			display: inline-flex;
			align-items: center;
			gap: 0.35rem;
			padding: 0.4rem 0.7rem;
			border-radius: 9999px;
			font-size: 0.72rem;
			font-weight: 600;
			border: 1px solid var(--border);
			background: var(--bg-subtle);
			color: var(--text-main);
			cursor: pointer;
			transition: all 0.15s ease;
			position: relative;
			white-space: nowrap;
		}
		.btn-pill:active { transform: scale(0.96); }
		.pulse-dot {
			width: 0.45rem;
			height: 0.45rem;
			border-radius: 50%;
			background: var(--success);
			animation: pulse 1.5s infinite;
		}
		.pulse-dot.off { background: var(--text-muted); animation: none; }
		.btn-icon {
			width: 2.1rem;
			height: 2.1rem;
			border-radius: 0.6rem;
			border: 1px solid var(--border);
			background: var(--bg-subtle);
			color: var(--text-main);
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 1rem;
			transition: all 0.15s ease;
		}
		.btn-icon:active { transform: scale(0.94); }
		.hidden-date-input {
			position: absolute;
			inset: 0;
			opacity: 0;
			cursor: pointer;
			width: 100%;
			height: 100%;
		}

		/* PWA Install Banner (Visible only when installable) */
		.pwa-install-banner {
			display: none;
			align-items: center;
			justify-content: space-between;
			gap: 0.75rem;
			background: linear-gradient(135deg, rgba(2, 132, 199, 0.12), rgba(99, 102, 241, 0.12));
			border: 1px solid var(--primary);
			padding: 0.65rem 1rem;
			border-radius: 0.85rem;
		}
		.pwa-install-banner.show { display: flex; }
		.pwa-install-text { font-size: 0.75rem; font-weight: 600; color: var(--text-main); }
		.btn-install {
			padding: 0.35rem 0.85rem;
			border-radius: 0.5rem;
			background: var(--primary);
			color: #ffffff;
			border: none;
			font-size: 0.72rem;
			font-weight: 700;
			cursor: pointer;
		}

		/* Metrics Grid */
		.stats-grid {
			display: grid;
			grid-template-columns: repeat(4, 1fr);
			gap: 0.5rem;
		}
		.stat-card {
			background: var(--bg-card);
			border: 1px solid var(--border);
			border-radius: 0.75rem;
			padding: 0.65rem 0.75rem;
			box-shadow: var(--shadow-sm);
			display: flex;
			flex-direction: column;
			gap: 0.15rem;
		}
		.stat-label {
			font-size: 0.62rem;
			font-weight: 700;
			color: var(--text-muted);
			text-transform: uppercase;
			letter-spacing: 0.05em;
		}
		.stat-val {
			font-size: 1.15rem;
			font-weight: 800;
			line-height: 1.1;
			font-family: 'JetBrains Mono', monospace;
		}
		.stat-val.success { color: var(--success); }
		.stat-val.warning { color: var(--warning); }
		.stat-val.danger { color: var(--danger); }

		/* Search & Tabs Controls */
		.controls-bar {
			display: flex;
			flex-direction: column;
			gap: 0.6rem;
		}
		@media (min-width: 640px) {
			.controls-bar {
				flex-direction: row;
				align-items: center;
				justify-content: space-between;
			}
		}

		.tabs-wrapper {
			display: flex;
			background: var(--bg-card);
			border: 1px solid var(--border);
			padding: 0.25rem;
			border-radius: 0.75rem;
			gap: 0.2rem;
			box-shadow: var(--shadow-sm);
			overflow-x: auto;
			-webkit-overflow-scrolling: touch;
		}
		.tabs-wrapper::-webkit-scrollbar { display: none; }
		.tab-btn {
			flex: 1;
			padding: 0.35rem 0.65rem;
			border-radius: 0.55rem;
			font-size: 0.72rem;
			font-weight: 600;
			border: none;
			background: transparent;
			color: var(--text-sub);
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 0.3rem;
			white-space: nowrap;
			transition: all 0.15s ease;
		}
		.tab-btn.active {
			background: var(--bg-subtle);
			color: var(--primary);
			font-weight: 700;
		}
		.tab-count {
			font-size: 0.62rem;
			padding: 0.05rem 0.3rem;
			border-radius: 9999px;
			background: var(--border);
			color: var(--text-sub);
		}
		.tab-btn.active .tab-count {
			background: rgba(2, 132, 199, 0.15);
			color: var(--primary);
		}

		.search-box {
			position: relative;
			width: 100%;
		}
		@media (min-width: 640px) {
			.search-box { max-width: 280px; }
		}
		.search-input {
			width: 100%;
			background: var(--bg-card);
			border: 1px solid var(--border);
			border-radius: 0.75rem;
			padding: 0.45rem 0.85rem 0.45rem 2.1rem;
			font-size: 0.8rem;
			color: var(--text-main);
			outline: none;
			box-shadow: var(--shadow-sm);
		}
		.search-input:focus { border-color: var(--primary); }
		.search-icon {
			position: absolute;
			left: 0.75rem;
			top: 50%;
			transform: translateY(-50%);
			color: var(--text-muted);
			pointer-events: none;
			display: flex;
		}

		/* Jobs List */
		.jobs-list {
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
		}
		.job-card {
			background: var(--bg-card);
			border: 1px solid var(--border);
			border-radius: 0.85rem;
			padding: 0.75rem 0.9rem;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 0.75rem;
			box-shadow: var(--shadow-sm);
			cursor: pointer;
			transition: all 0.15s ease;
		}
		.job-card:active {
			transform: scale(0.985);
			background: var(--bg-subtle);
		}
		.job-left {
			display: flex;
			align-items: center;
			gap: 0.75rem;
			min-width: 0;
			flex: 1;
		}
		.status-dot {
			width: 2.1rem;
			height: 2.1rem;
			border-radius: 0.6rem;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 0.95rem;
			flex-shrink: 0;
		}
		.status-dot.success { background: var(--success-bg); color: var(--success); }
		.status-dot.warning { background: var(--warning-bg); color: var(--warning); }
		.status-dot.danger { background: var(--danger-bg); color: var(--danger); }

		.job-meta { min-width: 0; flex: 1; }
		.job-title-row {
			display: flex;
			align-items: center;
			gap: 0.45rem;
			margin-bottom: 0.15rem;
		}
		.job-title {
			font-size: 0.84rem;
			font-weight: 700;
			color: var(--text-main);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		/* Green Time Pill Tag */
		.time-pill {
			font-size: 0.7rem;
			font-weight: 700;
			color: var(--success);
			background: var(--success-bg);
			font-family: 'JetBrains Mono', monospace;
			padding: 0.1rem 0.45rem;
			border-radius: 0.35rem;
			flex-shrink: 0;
			display: inline-flex;
			align-items: center;
		}

		.job-sub-row {
			display: flex;
			align-items: center;
			gap: 0.5rem;
			font-size: 0.7rem;
			color: var(--text-sub);
		}
		.recs-badge {
			font-weight: 700;
			font-family: 'JetBrains Mono', monospace;
			color: var(--text-main);
		}

		.job-actions {
			display: flex;
			align-items: center;
			gap: 0.4rem;
			flex-shrink: 0;
		}
		.btn-run {
			padding: 0.35rem 0.75rem;
			border-radius: 0.5rem;
			font-size: 0.7rem;
			font-weight: 700;
			border: 1px solid var(--border);
			background: var(--bg-subtle);
			color: var(--text-main);
			cursor: pointer;
			transition: all 0.15s ease;
		}
		.btn-run:active { background: var(--primary); color: #ffffff; }
		.btn-run:disabled { opacity: 0.5; cursor: not-allowed; }
		.badge-synced {
			font-size: 0.7rem;
			font-weight: 700;
			color: var(--success);
			background: var(--success-bg);
			padding: 0.3rem 0.65rem;
			border-radius: 0.5rem;
			display: inline-flex;
			align-items: center;
			gap: 0.25rem;
		}

		/* Mobile-Responsive Modal Bottom Sheet with Backdrop Filter Blur */
		.modal-overlay {
			position: fixed;
			inset: 0;
			z-index: 100;
			background: rgba(15, 23, 42, 0.55);
			-webkit-backdrop-filter: blur(12px);
			backdrop-filter: blur(12px);
			display: flex;
			align-items: flex-end;
			justify-content: center;
			opacity: 0;
			pointer-events: none;
			transition: opacity 0.2s ease;
		}
		@media (min-width: 640px) {
			.modal-overlay {
				align-items: center;
				padding: 1rem;
			}
		}
		.modal-overlay.open {
			opacity: 1;
			pointer-events: auto;
		}
		.modal-card {
			background: var(--bg-card);
			border: 1px solid var(--border);
			border-radius: 1.5rem 1.5rem 0 0;
			width: 100%;
			max-width: 540px;
			max-height: 85vh;
			display: flex;
			flex-direction: column;
			box-shadow: 0 -10px 25px -5px rgba(0, 0, 0, 0.2);
			overflow: hidden;
			transform: translateY(100%);
			transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
		}
		@media (min-width: 640px) {
			.modal-card {
				border-radius: 1.25rem;
				transform: scale(0.96);
				box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
			}
			.modal-overlay.open .modal-card {
				transform: scale(1);
			}
		}
		.modal-overlay.open .modal-card {
			transform: translateY(0);
		}

		.modal-grabber {
			width: 2.5rem;
			height: 0.25rem;
			background: var(--border);
			border-radius: 9999px;
			margin: 0.5rem auto 0;
		}
		@media (min-width: 640px) {
			.modal-grabber { display: none; }
		}

		.modal-header {
			padding: 0.9rem 1.2rem;
			border-bottom: 1px solid var(--border);
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 0.75rem;
		}
		.modal-title-box { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
		.modal-title { font-size: 0.95rem; font-weight: 700; color: var(--text-main); }
		.btn-close {
			width: 1.85rem;
			height: 1.85rem;
			border-radius: 0.5rem;
			border: none;
			background: var(--bg-subtle);
			color: var(--text-sub);
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 1rem;
		}

		.modal-body {
			padding: 1.1rem;
			overflow-y: auto;
			display: flex;
			flex-direction: column;
			gap: 0.85rem;
		}
		.modal-grid {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 0.5rem;
			background: var(--bg-subtle);
			padding: 0.75rem;
			border-radius: 0.65rem;
		}
		.grid-item { display: flex; flex-direction: column; gap: 0.15rem; }
		.grid-lbl { font-size: 0.62rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
		.grid-val { font-size: 0.82rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; }

		.code-block {
			background: var(--bg-subtle);
			border: 1px solid var(--border);
			padding: 0.6rem 0.75rem;
			border-radius: 0.6rem;
			font-family: 'JetBrains Mono', monospace;
			font-size: 0.7rem;
			word-break: break-all;
			color: var(--text-main);
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 0.5rem;
		}
		.error-box {
			background: var(--danger-bg);
			border: 1px solid rgba(220, 38, 38, 0.2);
			color: var(--danger);
			padding: 0.75rem;
			border-radius: 0.65rem;
			font-family: 'JetBrains Mono', monospace;
			font-size: 0.68rem;
			white-space: pre-wrap;
			max-height: 140px;
			overflow-y: auto;
		}

		.modal-footer {
			padding: 0.75rem 1.1rem;
			border-top: 1px solid var(--border);
			display: flex;
			align-items: center;
			justify-content: flex-end;
			gap: 0.5rem;
			background: var(--bg-subtle);
		}

		/* Minimal Toast */
		.toast {
			position: fixed;
			bottom: 1.5rem;
			left: 50%;
			transform: translateX(-50%) translateY(20px);
			z-index: 200;
			padding: 0.55rem 1.1rem;
			border-radius: 9999px;
			font-size: 0.75rem;
			font-weight: 600;
			background: #0f172a;
			color: #ffffff;
			box-shadow: var(--shadow-md);
			display: flex;
			align-items: center;
			gap: 0.45rem;
			opacity: 0;
			pointer-events: none;
			transition: all 0.2s ease;
		}
		.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

		@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
		.spin { animation: spin 1s linear infinite; }
		@keyframes spin { 100% { transform: rotate(360deg); } }
	</style>
</head>
<body>

	<main class="app-container">

		<!-- Top Header -->
		<header class="app-header">
			<div class="brand-box">
				<div class="brand-logo">ST</div>
				<div class="brand-text">
					<h1 class="brand-title">Sync Tracker</h1>
					<p class="brand-subtitle">Sahayog Operations</p>
				</div>
			</div>

			<div class="header-actions">
				<!-- Date Picker Button -->
				<button class="btn-pill" title="Select Sync Date">
					<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
					<span id="date-label">Loading...</span>
					<input type="date" id="date-input" class="hidden-date-input">
				</button>

				<!-- Auto Sync Toggle -->
				<button class="btn-pill" id="btn-auto-sync" title="Toggle Auto Sync">
					<div class="pulse-dot" id="auto-sync-dot"></div>
					<span id="auto-sync-text">Auto</span>
				</button>

				<!-- Refresh Button -->
				<button class="btn-icon" id="btn-refresh" title="Refresh Status">
					<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
				</button>

				<!-- Theme Toggle -->
				<button class="btn-icon" id="btn-theme" title="Toggle Theme">
					<svg id="theme-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
				</button>
			</div>
		</header>

		<!-- PWA Install Banner -->
		<div class="pwa-install-banner" id="pwa-banner">
			<span class="pwa-install-text">📱 Install Sync Tracker as Mobile App</span>
			<button class="btn-install" id="btn-pwa-install">Install</button>
		</div>

		<!-- Stats Grid -->
		<section class="stats-grid">
			<div class="stat-card">
				<span class="stat-label">Total</span>
				<span class="stat-val" id="stat-total">0</span>
			</div>
			<div class="stat-card">
				<span class="stat-label">Synced</span>
				<span class="stat-val success" id="stat-success">0</span>
			</div>
			<div class="stat-card">
				<span class="stat-label">Pending</span>
				<span class="stat-val warning" id="stat-pending">0</span>
			</div>
			<div class="stat-card">
				<span class="stat-label">Failed</span>
				<span class="stat-val danger" id="stat-failed">0</span>
			</div>
		</section>

		<!-- Controls Bar: Filter Tabs & Search -->
		<section class="controls-bar">
			<div class="tabs-wrapper">
				<button class="tab-btn active" data-tab="all">All <span class="tab-count" id="cnt-all">0</span></button>
				<button class="tab-btn" data-tab="success">Synced <span class="tab-count" id="cnt-success">0</span></button>
				<button class="tab-btn" data-tab="pending">Pending <span class="tab-count" id="cnt-pending">0</span></button>
				<button class="tab-btn" data-tab="failed">Failed <span class="tab-count" id="cnt-failed">0</span></button>
			</div>

			<div class="search-box">
				<span class="search-icon">
					<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
				</span>
				<input type="text" id="search-input" class="search-input" placeholder="Search automation job...">
			</div>
		</section>

		<!-- Jobs List Container -->
		<section class="jobs-list" id="jobs-container">
			<div style="padding: 3rem; text-align: center; color: var(--text-muted); font-size: 0.82rem;">
				Loading automation jobs...
			</div>
		</section>

	</main>

	<!-- Mobile-Responsive Modal with Backdrop Blur -->
	<div class="modal-overlay" id="modal-overlay">
		<div class="modal-card">
			<div class="modal-grabber"></div>
			<div class="modal-header">
				<div class="modal-title-box">
					<span id="modal-status-dot" class="status-dot success" style="width: 1.75rem; height: 1.75rem;">✓</span>
					<div class="modal-title" id="modal-title">Job Details</div>
				</div>
				<button class="btn-close" id="btn-modal-close">&times;</button>
			</div>

			<div class="modal-body">
				<div class="modal-grid">
					<div class="grid-item">
						<span class="grid-lbl">Schedule</span>
						<span class="grid-val" id="modal-schedule" style="color: var(--success);">-</span>
					</div>
					<div class="grid-item">
						<span class="grid-lbl">Target Date</span>
						<span class="grid-val" id="modal-date">-</span>
					</div>
					<div class="grid-item">
						<span class="grid-lbl">Records Synced</span>
						<span class="grid-val" id="modal-recs">-</span>
					</div>
				</div>

				<div class="grid-item">
					<span class="grid-lbl" style="margin-bottom: 0.25rem;">Backend Python Method</span>
					<div class="code-block">
						<span id="modal-method" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">-</span>
						<button class="btn-pill" id="btn-copy-method" style="padding: 0.2rem 0.5rem; font-size: 0.65rem;">Copy</button>
					</div>
				</div>

				<div class="grid-item" id="modal-error-wrap" style="display: none;">
					<span class="grid-lbl" style="margin-bottom: 0.25rem; color: var(--danger);">Error Message / Traceback</span>
					<div class="error-box" id="modal-error-text"></div>
				</div>
			</div>

			<div class="modal-footer">
				<button class="btn-pill" id="btn-modal-close2">Close</button>
				<button class="btn-run" id="btn-modal-run" style="padding: 0.45rem 1rem;">Run Sync Now</button>
			</div>
		</div>
	</div>

	<!-- Minimal Toast -->
	<div class="toast" id="toast">
		<span id="toast-msg">Notification</span>
	</div>

	<script>
		window.initialData = {{ initial_sync_data | default('{}') }};
		window.csrf_token = "{{ csrf_token | default('') }}";

		// Unregister any legacy Service Worker to ensure fresh live data
		if ('serviceWorker' in navigator) {
			navigator.serviceWorker.getRegistrations().then((registrations) => {
				for (const registration of registrations) {
					registration.unregister();
				}
			});
		}

		(function() {
			let deferredPrompt = null;
			const pwaBanner = document.getElementById('pwa-banner');
			const btnPwaInstall = document.getElementById('btn-pwa-install');

			window.addEventListener('beforeinstallprompt', (e) => {
				e.preventDefault();
				deferredPrompt = e;
				if (pwaBanner) pwaBanner.classList.add('show');
			});

			if (btnPwaInstall) {
				btnPwaInstall.addEventListener('click', async () => {
					if (!deferredPrompt) return;
					deferredPrompt.prompt();
					const { outcome } = await deferredPrompt.userChoice;
					if (outcome === 'accepted') {
						if (pwaBanner) pwaBanner.classList.remove('show');
					}
					deferredPrompt = null;
				});
			}

			const state = {
				jobs: [],
				targetDate: new Date(Date.now() - 86400000).toISOString().split('T')[0],
				autoSyncEnabled: false,
				activeTab: 'all',
				searchQuery: '',
				runningJobs: {},
				selectedJob: null,
				isDark: localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)
			};

			const els = {
				dateLabel: document.getElementById('date-label'),
				dateInput: document.getElementById('date-input'),
				autoSyncDot: document.getElementById('auto-sync-dot'),
				autoSyncText: document.getElementById('auto-sync-text'),
				btnAutoSync: document.getElementById('btn-auto-sync'),
				btnRefresh: document.getElementById('btn-refresh'),
				btnTheme: document.getElementById('btn-theme'),
				themeIcon: document.getElementById('theme-icon'),
				statTotal: document.getElementById('stat-total'),
				statSuccess: document.getElementById('stat-success'),
				statPending: document.getElementById('stat-pending'),
				statFailed: document.getElementById('stat-failed'),
				cntAll: document.getElementById('cnt-all'),
				cntSuccess: document.getElementById('cnt-success'),
				cntPending: document.getElementById('cnt-pending'),
				cntFailed: document.getElementById('cnt-failed'),
				searchInput: document.getElementById('search-input'),
				jobsContainer: document.getElementById('jobs-container'),
				modalOverlay: document.getElementById('modal-overlay'),
				modalStatusDot: document.getElementById('modal-status-dot'),
				modalTitle: document.getElementById('modal-title'),
				modalSchedule: document.getElementById('modal-schedule'),
				modalDate: document.getElementById('modal-date'),
				modalRecs: document.getElementById('modal-recs'),
				modalMethod: document.getElementById('modal-method'),
				modalErrorWrap: document.getElementById('modal-error-wrap'),
				modalErrorText: document.getElementById('modal-error-text'),
				btnCopyMethod: document.getElementById('btn-copy-method'),
				btnModalClose: document.getElementById('btn-modal-close'),
				btnModalClose2: document.getElementById('btn-modal-close2'),
				btnModalRun: document.getElementById('btn-modal-run'),
				toast: document.getElementById('toast'),
				toastMsg: document.getElementById('toast-msg')
			};

			function parseTimeToMinutes(tStr) {
				if (!tStr) return 9999;
				const parts = tStr.trim().split(/[:\s]/);
				if (parts.length < 3) return 9999;
				let h = parseInt(parts[0], 10);
				const m = parseInt(parts[1], 10);
				const mer = parts[2].toUpperCase();
				if (mer === 'PM' && h < 12) h += 12;
				if (mer === 'AM' && h === 12) h = 0;
				return h * 60 + m;
			}

			function formatDate(dStr) {
				if (!dStr) return '';
				const parts = dStr.split(' ')[0].split('-');
				return parts.length === 3 ? `${parts[2]}-${parts[1]}-${parts[0]}` : dStr;
			}

			function formatNum(num) {
				if (!num && num !== 0) return '0';
				return Number(num).toLocaleString('en-IN');
			}

			let toastTimer = null;
			function showToast(msg) {
				if (toastTimer) clearTimeout(toastTimer);
				els.toastMsg.innerText = msg;
				els.toast.classList.add('show');
				toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2500);
			}

			function applyTheme() {
				if (state.isDark) {
					document.documentElement.setAttribute('data-theme', 'dark');
					els.themeIcon.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>';
				} else {
					document.documentElement.removeAttribute('data-theme');
					els.themeIcon.innerHTML = '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>';
				}
			}

			async function fetchStatus() {
				try {
					els.btnRefresh.classList.add('spin');
					const res = await fetch(`/api/method/custom_report.api.get_automation_sync_status?sync_date=${state.targetDate}`);
					if (!res.ok) throw new Error(`HTTP ${res.status}`);
					const data = await res.json();
					if (data.message) {
						state.jobs = data.message.jobs || [];
						state.autoSyncEnabled = !!data.message.auto_sync_enabled;
						render();
					}
				} catch (e) {
					showToast('Failed to load status');
				} finally {
					setTimeout(() => els.btnRefresh.classList.remove('spin'), 400);
				}
			}

			async function toggleAutoSync() {
				const newVal = !state.autoSyncEnabled;
				try {
					const res = await fetch(`/api/method/custom_report.api.toggle_drishti_auto_sync`, {
						method: 'POST',
						headers: { 'Content-Type': 'application/json', 'X-Frappe-CSRF-Token': window.csrf_token || '' },
						body: JSON.stringify({ enabled: newVal })
					});
					const data = await res.json();
					if (data.message && data.message.status === 'success') {
						state.autoSyncEnabled = data.message.auto_sync_enabled;
						showToast(`Auto Sync ${state.autoSyncEnabled ? 'Enabled' : 'Disabled'}`);
						render();
					}
				} catch (e) {
					showToast('Error toggling auto sync');
				}
			}

			async function runJob(jobKey) {
				if (!jobKey || state.runningJobs[jobKey]) return;
				state.runningJobs[jobKey] = true;
				render();
				try {
					const res = await fetch(`/api/method/custom_report.api.trigger_manual_sync`, {
						method: 'POST',
						headers: { 'Content-Type': 'application/json', 'X-Frappe-CSRF-Token': window.csrf_token || '' },
						body: JSON.stringify({ job_key: jobKey, sync_date: state.targetDate })
					});
					const data = await res.json();
					showToast(data.message?.message || 'Sync initiated successfully');
					await fetchStatus();
				} catch (e) {
					showToast(`Execution error: ${e.message}`);
				} finally {
					delete state.runningJobs[jobKey];
					render();
				}
			}

			function openModal(job) {
				state.selectedJob = job;
				const st = (job.status || '').toLowerCase();
				els.modalTitle.innerText = job.title;
				els.modalSchedule.innerText = job.schedule_time || '-';
				els.modalDate.innerText = formatDate(job.target_date);
				els.modalRecs.innerText = `${formatNum(job.records_synced)} recs`;
				els.modalMethod.innerText = job.method || '-';

				els.modalStatusDot.className = `status-dot ${st === 'success' ? 'success' : st === 'failed' ? 'danger' : 'warning'}`;
				els.modalStatusDot.innerText = st === 'success' ? '✓' : st === 'failed' ? '!' : '⏱';

				if (job.error_message) {
					els.modalErrorWrap.style.display = 'block';
					els.modalErrorText.innerText = job.error_message;
				} else {
					els.modalErrorWrap.style.display = 'none';
				}

				els.modalOverlay.classList.add('open');
			}

			function closeModal() {
				els.modalOverlay.classList.remove('open');
				state.selectedJob = null;
			}

			function render() {
				els.dateLabel.innerText = formatDate(state.targetDate);
				els.dateInput.value = state.targetDate;
				els.autoSyncDot.className = `pulse-dot ${state.autoSyncEnabled ? '' : 'off'}`;
				els.autoSyncText.innerText = state.autoSyncEnabled ? 'Auto' : 'Off';

				const total = state.jobs.length;
				const success = state.jobs.filter(j => (j.status || '').toLowerCase() === 'success').length;
				const failed = state.jobs.filter(j => (j.status || '').toLowerCase() === 'failed').length;
				const pending = state.jobs.filter(j => (j.status || '').toLowerCase() === 'pending').length;

				els.statTotal.innerText = total;
				els.statSuccess.innerText = success;
				els.statPending.innerText = pending;
				els.statFailed.innerText = failed;

				els.cntAll.innerText = total;
				els.cntSuccess.innerText = success;
				els.cntPending.innerText = pending;
				els.cntFailed.innerText = failed;

				const q = state.searchQuery.toLowerCase().trim();
				const filtered = state.jobs.filter(job => {
					const s = (job.status || '').toLowerCase();
					if (state.activeTab !== 'all' && s !== state.activeTab) return false;
					if (q) {
						return (job.title || '').toLowerCase().includes(q) ||
							   (job.method || '').toLowerCase().includes(q) ||
							   (job.category || '').toLowerCase().includes(q);
					}
					return true;
				});

				filtered.sort((a, b) => parseTimeToMinutes(a.schedule_time) - parseTimeToMinutes(b.schedule_time));

				if (filtered.length === 0) {
					els.jobsContainer.innerHTML = `
						<div style="padding: 3rem 1rem; text-align: center; color: var(--text-muted); font-size: 0.82rem;">
							No automation tasks found matching criteria.
						</div>
					`;
					return;
				}

				els.jobsContainer.innerHTML = filtered.map(job => {
					const st = (job.status || '').toLowerCase();
					const isRunning = !!state.runningJobs[job.key];
					const statusClass = st === 'success' ? 'success' : st === 'failed' ? 'danger' : 'warning';
					const statusIcon = st === 'success' ? '✓' : st === 'failed' ? '!' : '⏱';

					return `
						<div class="job-card" data-key="${job.key}">
							<div class="job-left">
								<div class="status-dot ${statusClass}">${statusIcon}</div>
								<div class="job-meta">
									<div class="job-title-row">
										<span class="job-title">${job.title}</span>
										<span class="time-pill">${job.schedule_time || ''}</span>
									</div>
									<div class="job-sub-row">
										<span>${job.category || 'General'}</span>
										<span>•</span>
										<span class="recs-badge">${formatNum(job.records_synced)} recs</span>
									</div>
								</div>
							</div>
							<div class="job-actions">
								${st === 'success' 
									? `<span class="badge-synced">✓ Synced</span>`
									: `<button type="button" class="btn-run" data-action="run" data-key="${job.key}" ${isRunning ? 'disabled' : ''}>
										${isRunning ? 'Running...' : 'Run'}
									   </button>`}
							</div>
						</div>
					`;
				}).join('');
			}

			// Event Listeners
			els.btnAutoSync.addEventListener('click', toggleAutoSync);
			els.dateInput.addEventListener('change', (e) => {
				state.targetDate = e.target.value;
				fetchStatus();
			});
			els.btnRefresh.addEventListener('click', fetchStatus);
			els.btnTheme.addEventListener('click', () => {
				state.isDark = !state.isDark;
				localStorage.setItem('theme', state.isDark ? 'dark' : 'light');
				applyTheme();
			});

			document.querySelectorAll('.tab-btn').forEach(btn => {
				btn.addEventListener('click', () => {
					document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
					btn.classList.add('active');
					state.activeTab = btn.dataset.tab;
					render();
				});
			});

			els.searchInput.addEventListener('input', (e) => {
				state.searchQuery = e.target.value;
				render();
			});

			els.jobsContainer.addEventListener('click', (e) => {
				const runBtn = e.target.closest('[data-action="run"]');
				if (runBtn) {
					e.stopPropagation();
					runJob(runBtn.dataset.key);
					return;
				}
				const card = e.target.closest('.job-card');
				if (card) {
					const job = state.jobs.find(j => j.key === card.dataset.key);
					if (job) openModal(job);
				}
			});

			els.btnModalClose.addEventListener('click', closeModal);
			els.btnModalClose2.addEventListener('click', closeModal);
			els.modalOverlay.addEventListener('click', (e) => {
				if (e.target === els.modalOverlay) closeModal();
			});
			document.addEventListener('keydown', (e) => {
				if (e.key === 'Escape' && els.modalOverlay.classList.contains('open')) closeModal();
			});

			els.btnCopyMethod.addEventListener('click', () => {
				if (state.selectedJob?.method) {
					navigator.clipboard.writeText(state.selectedJob.method);
					showToast('Method copied to clipboard');
				}
			});

			els.btnModalRun.addEventListener('click', () => {
				if (state.selectedJob?.key) {
					const key = state.selectedJob.key;
					closeModal();
					runJob(key);
				}
			});

			applyTheme();

			if (window.initialData && Array.isArray(window.initialData.jobs) && window.initialData.jobs.length > 0) {
				state.jobs = window.initialData.jobs;
				state.autoSyncEnabled = !!window.initialData.auto_sync_enabled;
				if (window.initialData.sync_date) state.targetDate = window.initialData.sync_date;
				render();
			} else {
				fetchStatus();
			}
		})();
	</script>
</body>
</html>
