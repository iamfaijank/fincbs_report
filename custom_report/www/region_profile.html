<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Region Profile - {{ region }}</title>
		<style>
			:root {
				--transition-base: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
				--transition-fast: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
				--shadow-sm: 0 0 0 1px rgba(0, 0, 0, 0.08), 0 2px 4px rgba(0, 0, 0, 0.08);
				--shadow-md: 0 0 0 1px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.12);
				--radius-sm: 4px;
				--radius-md: 8px;
				--linkedin-bg: #f3f2ef;
				--linkedin-white: #ffffff;
				--linkedin-text: #000000;
				--linkedin-text-secondary: #666666;
				--linkedin-text-muted: #8e8e8e;
				--linkedin-blue: #0a66c2;
				--linkedin-border: rgba(0, 0, 0, 0.08);
				--teal-primary: #097c80;
				--teal-dark: #075c5f;
			}

			body {
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
					sans-serif;
				background-color: #f4f7f6;
				color: #333;
				margin: 0;
				padding: 0;
				overflow-x: hidden;
				width: 100%;
			}

			/* ========== TOP NAVIGATION BAR (Branch Profile Replica) ========== */
			.top-nav-bar {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 20px;
				padding: 12px 24px;
				background: var(--linkedin-white);
				border-bottom: 1px solid var(--linkedin-border);
				box-shadow: var(--shadow-sm);
				position: sticky;
				top: 0;
				z-index: 100;
			}

			/* Left: Breadcrumb */
			.nav-breadcrumb {
				display: flex;
				align-items: center;
				gap: 8px;
				font-size: 14px;
				color: var(--linkedin-text-secondary);
				flex-shrink: 0;
			}
			.nav-breadcrumb a {
				color: var(--teal-primary);
				text-decoration: none;
				font-weight: 500;
				transition: var(--transition-fast);
			}
			.nav-breadcrumb a:hover {
				color: var(--teal-dark);
				text-decoration: underline;
			}
			.nav-breadcrumb .separator {
				color: var(--linkedin-text-muted);
				margin: 0 4px;
			}
			.nav-breadcrumb .current {
				color: var(--linkedin-text);
				font-weight: 600;
			}

			/* Center: Search Bar */
			.nav-search-container {
				display: flex;
				align-items: center;
				gap: 10px;
				flex: 1;
				max-width: 500px;
				justify-content: center;
			}
			.nav-search-label {
				font-weight: 500;
				color: var(--linkedin-text-secondary);
				font-size: 14px;
				white-space: nowrap;
			}
			.nav-search-wrapper {
				position: relative;
				flex: 1;
				max-width: 350px;
			}
			.nav-search-input {
				width: 100%;
				padding: 8px 12px 8px 36px;
				border: 1px solid var(--linkedin-border);
				border-radius: var(--radius-sm);
				font-size: 14px;
				color: var(--linkedin-text);
				background: var(--linkedin-white);
				transition: var(--transition-base);
			}
			.nav-search-input:focus {
				outline: none;
				border-color: var(--linkedin-blue);
				box-shadow: 0 0 0 2px rgba(10, 102, 194, 0.1);
			}
			.nav-search-input::placeholder {
				color: var(--linkedin-text-muted);
			}
			.nav-search-icon {
				position: absolute;
				left: 10px;
				top: 50%;
				transform: translateY(-50%);
				color: var(--linkedin-text-muted);
				font-size: 14px;
				pointer-events: none;
			}
			.nav-search-btn {
				padding: 8px 16px;
				background: #ffc107;
				border: 1px solid #e0a800;
				border-radius: var(--radius-sm);
				color: #000;
				font-weight: 600;
				font-size: 14px;
				cursor: pointer;
				transition: var(--transition-fast);
			}
			.nav-search-btn:hover {
				background: #ffca2c;
				border-color: #ffc107;
			}

			/* Right: Toggle + Back Button */
			.nav-right-section {
				display: flex;
				align-items: center;
				gap: 12px;
				flex-shrink: 0;
			}
			.format-toggle-group {
				display: flex;
				border: 1px solid var(--linkedin-border);
				border-radius: var(--radius-sm);
				overflow: hidden;
			}
			.format-toggle-btn {
				padding: 8px 14px;
				background: var(--linkedin-white);
				border: none;
				border-right: 1px solid var(--linkedin-border);
				color: var(--linkedin-text-secondary);
				font-size: 13px;
				font-weight: 600;
				cursor: pointer;
				transition: var(--transition-fast);
			}
			.format-toggle-btn:last-child {
				border-right: none;
			}
			.format-toggle-btn:hover {
				background: var(--linkedin-bg);
			}
			.format-toggle-btn.active {
				background: var(--teal-primary);
				color: var(--linkedin-white);
			}
			.back-btn {
				display: flex;
				align-items: center;
				gap: 6px;
				padding: 8px 14px;
				background: var(--linkedin-white);
				border: 1px solid var(--linkedin-border);
				border-radius: var(--radius-sm);
				color: var(--linkedin-text-secondary);
				font-size: 13px;
				font-weight: 600;
				cursor: pointer;
				transition: var(--transition-fast);
			}
			.back-btn:hover {
				background: var(--linkedin-bg);
				border-color: var(--linkedin-text-muted);
			}
			.back-btn-icon {
				font-size: 14px;
			}

			/* ========== MAIN CONTENT ========== */
			.main-container {
				max-width: 1400px;
				margin: 0 auto;
				padding: 24px;
				background: var(--linkedin-white);
				min-height: calc(100vh - 80px);
			}

			.section-header {
				margin-bottom: 20px;
			}
			.section-title {
				color: var(--teal-primary);
				font-size: 24px;
				font-weight: 700;
				margin: 0 0 8px 0;
			}
			.section-subtitle {
				font-size: 14px;
				color: var(--linkedin-text-muted);
				margin: 0;
			}

			/* ========== PRODUCT TABLE ========== */
			.product-table-container {
				width: 100%;
				background: var(--linkedin-white);
				border: 1px solid var(--linkedin-border);
				border-radius: var(--radius-md);
				overflow: hidden;
				box-shadow: var(--shadow-sm);
			}
			table {
				width: 100%;
				border-collapse: collapse;
			}
			th {
				background-color: var(--teal-primary);
				color: white;
				text-transform: uppercase;
				font-size: 13px;
				font-weight: 600;
				padding: 14px 16px;
				text-align: left;
				letter-spacing: 0.5px;
			}
			td {
				padding: 12px 16px;
				border-bottom: 1px solid var(--linkedin-border);
				font-size: 14px;
			}
			tr:hover {
				background-color: var(--linkedin-bg);
			}
			tfoot tr {
				background-color: #e8f4f4;
			}
			tfoot td {
				font-weight: 700;
				font-size: 15px;
				border-bottom: none;
			}
			.product-col {
				min-width: 250px;
			}
			.amount-col {
				text-align: right;
				font-family: 'Consolas', 'Monaco', monospace;
				font-size: 14px;
				font-weight: 600;
				color: var(--linkedin-text);
			}
			.total-amount {
				color: var(--teal-primary);
				font-size: 16px;
			}

			/* ========== SUGGESTIONS DROPDOWN ========== */
			#search-suggestions {
				position: absolute;
				top: 100%;
				left: 0;
				right: 0;
				background: var(--linkedin-white);
				border: 1px solid var(--linkedin-border);
				border-radius: var(--radius-sm);
				box-shadow: var(--shadow-md);
				z-index: 1000;
				max-height: 300px;
				overflow-y: auto;
				display: none;
			}
			#search-suggestions.show {
				display: block;
			}
			.suggestion-item {
				padding: 10px 14px;
				cursor: pointer;
				transition: var(--transition-fast);
				border-bottom: 1px solid var(--linkedin-border);
			}
			.suggestion-item:last-child {
				border-bottom: none;
			}
			.suggestion-item:hover {
				background: var(--linkedin-bg);
			}
			.suggestion-sol {
				font-weight: 700;
				color: var(--linkedin-text);
			}
			.suggestion-branch {
				color: var(--linkedin-text-secondary);
				font-size: 13px;
			}

			/* ========== RESPONSIVE ========== */
			@media (max-width: 992px) {
				.top-nav-bar {
					flex-wrap: wrap;
					padding: 12px 16px;
				}
				.nav-search-container {
					order: 3;
					width: 100%;
					max-width: none;
					margin-top: 12px;
				}
				.nav-search-wrapper {
					max-width: none;
				}
			}
		</style>
	</head>
	<body>
		<!-- Top Navigation Bar (Branch Profile Replica) -->
		<nav class="top-nav-bar">
			<!-- Left: Breadcrumb -->
			<div class="nav-breadcrumb">
				<a href="/app/sahayog_dashboard">Home</a>
				<span class="separator">/</span>
				<span>{{ zone }}</span>
				<span class="separator">/</span>
				<span class="current">{{ region }}</span>
			</div>

			<!-- Center: Search Bar -->
			<div class="nav-search-container">
				<label class="nav-search-label">Search:</label>
				<div class="nav-search-wrapper">
					<span class="nav-search-icon">🔍</span>
					<input
						type="text"
						id="branch-search"
						class="nav-search-input"
						placeholder="Search by SOL ID or Branch Name..."
					/>
					<div id="search-suggestions"></div>
				</div>
				<button class="nav-search-btn" onclick="handleSearch()">Search</button>
			</div>

			<!-- Right: Format Toggle + Back Button -->
			<div class="nav-right-section">
				<div class="format-toggle-group">
					<button class="format-toggle-btn active" data-format="words" onclick="setFormat('words')">WORDS</button>
					<button class="format-toggle-btn" data-format="numbers" onclick="setFormat('numbers')">NUMBERS</button>
				</div>
				<button class="back-btn" onclick="window.history.back()">
					<span class="back-btn-icon">←</span>
					Back
				</button>
			</div>
		</nav>

		<!-- Main Content -->
		<main class="main-container">
			<div class="section-header">
				<h1 class="section-title">Product Performance</h1>
				<p class="section-subtitle">{{ zone }} - {{ region }}</p>
			</div>

			<section>
				<div class="product-table-container">
					<table>
						<thead>
							<tr>
								<th class="product-col">Product</th>
								<th class="amount-col">Ach</th>
							</tr>
						</thead>
						<tbody>
							{% for item in products %}
							<tr>
								<td>{{ item.product }}</td>
								<td class="amount-col" data-raw="{{ item.ach }}">{{ "{:,.2f}".format(item.ach) }}</td>
							</tr>
							{% endfor %}
						</tbody>
						<tfoot>
							<tr>
								<td>TOTAL</td>
								<td class="amount-col total-amount" data-raw="{{ total_ach }}">{{ "{:,.2f}".format(total_ach) }}</td>
							</tr>
						</tfoot>
					</table>
				</div>
			</section>
		</main>

		<script>
			// Format state
			let currentFormat = 'words';

			// Format toggle function
			function setFormat(format) {
				currentFormat = format;
				
				// Update button states
				document.querySelectorAll('.format-toggle-btn').forEach(btn => {
					btn.classList.toggle('active', btn.dataset.format === format);
				});

				// Update all amount cells
				document.querySelectorAll('.amount-col').forEach(cell => {
					const rawValue = parseFloat(cell.dataset.raw);
					if (isNaN(rawValue)) return;

					if (format === 'words') {
						cell.textContent = formatToWords(rawValue);
					} else {
						cell.textContent = rawValue.toLocaleString('en-IN', {
							minimumFractionDigits: 2,
							maximumFractionDigits: 2
						});
					}
				});
			}

			// Format number to words (Cr/L/K)
			function formatToWords(num) {
				if (num >= 10000000) {
					return (num / 10000000).toFixed(2) + ' Cr';
				} else if (num >= 100000) {
					return (num / 100000).toFixed(2) + ' L';
				} else if (num >= 1000) {
					return (num / 1000).toFixed(2) + ' K';
				}
				return num.toFixed(2);
			}

			// Search functionality
			let searchTimeout;
			const searchInput = document.getElementById('branch-search');
			const suggestionsBox = document.getElementById('search-suggestions');

			searchInput.addEventListener('input', function() {
				const txt = this.value.trim();
				clearTimeout(searchTimeout);

				if (!txt) {
					suggestionsBox.classList.remove('show');
					suggestionsBox.innerHTML = '';
					return;
				}

				searchTimeout = setTimeout(() => {
					frappe.call({
						method: 'custom_report.custom_report.page.branch_profile.branch_profile.search_branches',
						args: { txt },
						callback: (r) => showSuggestions(r.message || [])
					});
				}, 300);
			});

			function showSuggestions(list) {
				suggestionsBox.innerHTML = '';
				
				if (!list.length) {
					suggestionsBox.classList.remove('show');
					return;
				}

				list.forEach(branch => {
					const item = document.createElement('div');
					item.className = 'suggestion-item';
					item.innerHTML = `
						<div class="suggestion-sol">${branch.sol_id}</div>
						<div class="suggestion-branch">${branch.branch}</div>
					`;
					item.addEventListener('click', () => {
						window.location.href = `/branch_profile?sol_id=${encodeURIComponent(branch.sol_id)}`;
					});
					suggestionsBox.appendChild(item);
				});

				suggestionsBox.classList.add('show');
			}

			// Handle search button click
			function handleSearch() {
				const txt = searchInput.value.trim();
				if (txt) {
					frappe.call({
						method: 'custom_report.custom_report.page.branch_profile.branch_profile.search_branches',
						args: { txt },
						callback: (r) => {
							if (r.message && r.message.length > 0) {
								window.location.href = `/branch_profile?sol_id=${encodeURIComponent(r.message[0].sol_id)}`;
							} else {
								frappe.msgprint('No branch found matching "' + txt + '"');
							}
						}
					});
				}
			}

			// Close suggestions when clicking outside
			document.addEventListener('click', function(e) {
				if (!e.target.closest('.nav-search-wrapper')) {
					suggestionsBox.classList.remove('show');
				}
			});

			// Initialize with words format
			setFormat('words');
		</script>
	</body>
</html>
